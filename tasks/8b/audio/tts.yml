name: tts-b8
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: install
        run: pip install -q edge-tts==7.3.1 imageio-ffmpeg
      - name: synth
        run: |
          set +e
          python worker.py > worker.log 2>&1
          echo "EXIT=$?" >> worker.log
      - name: publish
        if: always()
        run: |
          git config user.name "tts-bot"
          git config user.email "tts-bot@users.noreply.github.com"
          git add -f output/ worker.log
          git commit -m "audio output" || echo "no change"
          git push
